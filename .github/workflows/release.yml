name: Release WoW Forever addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Package and publish addon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = ./scripts/package-addon.ps1 -Tag $env:GITHUB_REF_NAME
          $version = [regex]::Escape($env:GITHUB_REF_NAME.TrimStart('v'))
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $version\s*\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (!$notes) { throw "Missing changelog for $env:GITHUB_REF_NAME" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $package --verify-tag --notes-file $notesPath

  curseforge:
    needs: release
    uses: ./.github/workflows/publish-curseforge.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
